name: CI

on:
  push: { branches: [main] }
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: masar
          POSTGRES_PASSWORD: masar_dev_password
          POSTGRES_DB: masar
        options: >-
          --health-cmd "pg_isready -U masar"
          --health-interval 5s --health-timeout 5s --health-retries 20
        ports: ["5432:5432"]
      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 20
        ports: ["6379:6379"]

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.13", cache: pip }

      - run: pip install -r backend/requirements.txt

      - name: Lint
        run: |
          ruff check backend
          ruff format --check backend

      - name: Unit tests
        # These cover the deterministic guarantees — SQL guard, calculator,
        # RRF, Arabic normalisation — and need no model or data.
        run: pytest backend/tests/unit -q

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "20", cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: npm ci
        working-directory: frontend
      - run: npx tsc --noEmit
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
