# =============================================================================
# MASAR AI — local stack
#   postgres : facts + pgvector embeddings + FTS, all in one engine
#   redis    : per-provider token buckets, semantic cache, session state
#   api      : FastAPI backend (profile "full"; omit to run the API on the host)
#
#   make up      → postgres + redis only (recommended for development)
#   make up-full → adds the containerised API
# =============================================================================

name: masar

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: masar-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-masar}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-masar_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-masar}
      # MUST be a UTF-8 locale, not C. pg_trgm decides what counts as a word
      # character using the database locale, so under --locale=C it generates
      # zero trigrams for Arabic and similarity('الاتحاد','الاتحاد') returns 0 —
      # silently disabling every Arabic fuzzy match in the system.
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C.UTF-8"
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - masar_pgdata:/var/lib/postgresql/data
      - ./scripts/init_db.sql:/docker-entrypoint-initdb.d/00_init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-masar} -d ${POSTGRES_DB:-masar}"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: masar-redis
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru"]
    ports:
      - "6379:6379"
    volumes:
      - masar_redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  # GraphRAG store. Opt-in: `docker compose --profile graph up` (or the `full`
  # profile). Absent, the graph tool degrades to a named gap. Memory is capped
  # low to fit the free-tier VM alongside Postgres + the API's local models.
  neo4j:
    profiles: ["graph", "full"]
    image: neo4j:5-community
    container_name: masar-neo4j
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:-masar_graph_dev_password}
      NEO4J_server_memory_heap_initial__size: 256m
      NEO4J_server_memory_heap_max__size: 512m
      NEO4J_server_memory_pagecache_size: 256m
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - masar_neo4jdata:/data
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p \"${NEO4J_PASSWORD:-masar_graph_dev_password}\" 'RETURN 1' >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
    restart: unless-stopped

  api:
    profiles: ["full"]
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: masar-api
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      POSTGRES_HOST: postgres
      REDIS_URL: redis://redis:6379/0
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:-masar_graph_dev_password}
      # host.docker.internal lets the container reach Ollama running on the Mac
      OLLAMA_BASE_URL: http://host.docker.internal:11434
    env_file:
      - .env
    ports:
      # Loopback-only. In prod Caddy reaches the API over the compose network
      # (reverse_proxy api:8000), and the deploy health-check curls localhost —
      # neither needs a public bind. Publishing on 0.0.0.0 would put the API
      # straight on the internet: Docker's DNAT bypasses host iptables, so only
      # the cloud security list would stand between it and the world, and a
      # direct hit bypasses Caddy (and the per-IP rate limit's X-Real-IP trust).
      - "127.0.0.1:8000:8000"
    volumes:
      - ./data:/app/data
      - ./reports:/app/reports
      - ./traces:/app/traces
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health').status==200 else 1)"]
      interval: 15s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  masar_pgdata:
  masar_redisdata:
  masar_neo4jdata:
