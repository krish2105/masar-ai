# Production overlay — adds Caddy (TLS + reverse proxy) in front of the API. The
# base docker-compose.yml is otherwise run unchanged: the whole reason for the
# always-on VM is that nothing about the validated stack has to change.
#
# Launch (from the repo root, on the VM):
#   docker compose -f docker-compose.yml -f deploy/docker-compose.prod.yml \
#     --profile full up -d --build
#
# The `full` profile brings up postgres, redis, neo4j and the api; this overlay
# adds caddy. Only 80/443 are reachable from outside the VM (the Oracle security
# list + host iptables open nothing else); Caddy reaches the API over the compose
# network.

services:
  caddy:
    profiles: ["full"]
    image: caddy:2
    container_name: masar-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      MASAR_HOSTNAME: ${MASAR_HOSTNAME:?set MASAR_HOSTNAME in .env, e.g. masar-api.duckdns.org}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - masar_caddydata:/data
      - masar_caddyconfig:/config
    depends_on:
      api:
        condition: service_healthy

# The API's base publish is loopback-only ("127.0.0.1:8000:8000"), so 8000 is
# never on a public interface here — no reliance on the cloud security list as
# the sole gate (Docker's DNAT bypasses host iptables, so that would be a single
# fragile layer). Caddy reaches the API over the compose network (reverse_proxy
# api:8000), and the deploy health-check curls localhost:8000; neither needs the
# port to be public. The Oracle security list opening only 80/443 is now
# defence-in-depth, not the thing standing between the API and the internet.

volumes:
  masar_caddydata:
  masar_caddyconfig:
