  ground_truth:
    computation: "A11: (salik_gates_crossed * tariff * 2 * 22) + fuel_estimate + parking_estimate  VS  fare_by_zone * 2 * 22"
    expected_assertions:
      - "Produces two exact totals from A11 and a clear comparison"
      - "Declares every assumption: gates crossed, fuel price, parking cost, working days, card type"
      - "States that fuel and parking are user-supplied assumptions, not RTA data"
      - "Reaches an explicit conclusion rather than listing both and stopping"
  required_sources:
