- id: EN-GS-046
  lang: en
  intent: GEOSPATIAL
  difficulty: hard
  question: "Which areas have taxi stands but no bus stop within one kilometre?"
  eval_method: sql_reference
  ground_truth:
    reference_sql: |
      SELECT t.stand_name_en, t.area_en, t.latitude, t.longitude
      FROM dim_taxi_stand t
      WHERE NOT EXISTS (
        SELECT 1 FROM dim_stop s
        WHERE 6371 * acos(
                LEAST(1, cos(radians(t.latitude)) * cos(radians(s.latitude))
                       * cos(radians(s.longitude) - radians(t.longitude))
                       + sin(radians(t.latitude)) * sin(radians(s.latitude)))
              ) <= 1.0
      );
    expected_assertions:
      - "Returns specific stands with coordinates"
      - "States the 1 km radius and that it is straight-line"
      - "Caveats that absence in the dataset is not proof of absence on the ground"
  required_sources:
    - dataset: "rta_taxi_stand_locations-open"
    - dataset: "rta_bus_stops_gis-open"
  must_trigger_agents: [A3, A4, A8, A10, A12]
  must_not:
