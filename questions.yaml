- id: EN-NA-031
  lang: en
  intent: NETWORK_ANALYTICS
  difficulty: medium
  question: "How has metro ridership trended over the available period?"
  eval_method: sql_reference
  ground_truth:
    reference_sql: |
      SELECT d.year, d.month, SUM(f.passenger_trips) AS trips
      FROM fact_ridership_monthly f
      JOIN dim_date d ON d.date_key = f.date_key
      WHERE f.mode = 'metro'
      GROUP BY d.year, d.month
      ORDER BY d.year, d.month;
    expected_assertions:
      - "States the actual date range covered by the data, not a generic 'recent years'"
      - "Describes direction of trend with supporting figures from the query"
      - "Flags the last_updated date of the source dataset"
  required_sources:
    - dataset: "rta_metro_ridership-open"
  must_trigger_agents: [A3, A4, A8]
  must_not:
    - "Extrapolate beyond the last period present in the data"
    - "Describe the trend as 'current' if the data ends more than 12 months ago"

- id: EN-NA-032
  lang: en
  intent: NETWORK_ANALYTICS
  difficulty: medium
  question: "Which bus routes carry the most passengers?"
  eval_method: sql_reference
  ground_truth:
    reference_sql: |
      SELECT r.route_number, r.route_name_en, SUM(f.passenger_trips) AS total_trips
      FROM fact_ridership_monthly f
      JOIN dim_route r ON r.route_id = f.route_id
      WHERE f.mode = 'bus'
      GROUP BY r.route_number, r.route_name_en
      ORDER BY total_trips DESC
      LIMIT 10;
    expected_assertions:
      - "Returns a ranked top-N list with actual passenger figures"
      - "States the aggregation period covered"
  required_sources:
    - dataset: "rta_bus_passengers_trips_by_route_monthly-open"
    - dataset: "rta_bus_routes-open"
  must_trigger_agents: [A3, A8]
  must_not:
    - "Rank routes without showing the underlying figures"

- id: EN-NA-033
  lang: en
  intent: NETWORK_ANALYTICS
  difficulty: medium
  question: "What is the modal split between metro, bus and tram?"
  eval_method: sql_reference
  ground_truth:
    reference_sql: |
      SELECT mode, SUM(trips) AS trips,
             ROUND(100.0 * SUM(trips) / SUM(SUM(trips)) OVER (), 2) AS share_pct
      FROM fact_modal_split_monthly
      GROUP BY mode
      ORDER BY trips DESC;
    expected_assertions:
      - "Returns percentage shares summing to approximately 100"
      - "States the period the split covers"
  required_sources:
    - dataset: "rta_public_transport_trips_by_type_of_transport_month-open"
  must_trigger_agents: [A3, A8]
  numeric_tolerance: 0.5
  must_not:
    - "Report shares that do not sum to ~100%"

- id: EN-NA-034
  lang: en
  intent: NETWORK_ANALYTICS
  difficulty: hard
  question: "Which bus routes are underutilised relative to the number of stops they serve?"
  eval_method: sql_reference
  ground_truth:
    reference_sql: |
      WITH stop_counts AS (
        SELECT route_id, COUNT(DISTINCT stop_id) AS stops
        FROM bridge_route_stop GROUP BY route_id
      ),
      trips AS (
        SELECT route_id, SUM(passenger_trips) AS total_trips
        FROM fact_ridership_monthly WHERE mode = 'bus' GROUP BY route_id
      )
      SELECT r.route_number, r.route_name_en, s.stops, t.total_trips,
             ROUND(t.total_trips::numeric / NULLIF(s.stops,0), 2) AS trips_per_stop
      FROM dim_route r
      JOIN stop_counts s ON s.route_id = r.route_id
      JOIN trips t ON t.route_id = r.route_id
      WHERE r.mode = 'bus'
      ORDER BY trips_per_stop ASC
      LIMIT 15;
    expected_assertions:
      - "Defines the utilisation metric it used before presenting results"
      - "Returns a ranked list with the computed ratio visible"
      - "Caveats that stop count is a crude proxy for catchment"
  required_sources:
    - dataset: "rta_bus_passengers_trips_by_route_monthly-open"
    - dataset: "rta_public_transportation_routes_stops-open"
  must_trigger_agents: [A3, A4, A8, A12]
  must_not:
    - "Present the ratio as an official RTA performance metric"

- id: EN-NA-035
  lang: en
  intent: NETWORK_ANALYTICS
  difficulty: medium
  question: "Has tram usage grown or declined?"
  eval_method: sql_reference
  ground_truth:
    reference_sql: |
      SELECT d.year, SUM(f.passenger_trips) AS trips
      FROM fact_ridership_monthly f
      JOIN dim_date d ON d.date_key = f.date_key
      WHERE f.mode = 'tram'
      GROUP BY d.year ORDER BY d.year;
    expected_assertions:
      - "Gives a directional answer supported by year-over-year figures"
      - "States data coverage period explicitly"
      - "If tram data is sparse or absent, says so rather than inferring"
  required_sources:
    - dataset: "rta_public_transport_trips_by_type_of_transport_month-open"
  must_trigger_agents: [A3, A8, A12]
  must_not:
    - "Assert a trend from fewer than two periods"

