- id: EN-JP-004
  lang: en
  intent: JOURNEY_PLANNING
  difficulty: medium
  question: "Is there a direct bus between Al Barsha and Ibn Battuta?"
  eval_method: assertion
  ground_truth:
    reference_sql: |
      SELECT r.route_number, r.route_name_en, COUNT(DISTINCT s.stop_id) AS matched_stops
      FROM dim_route r
      JOIN bridge_route_stop b ON b.route_id = r.route_id
      JOIN dim_stop s ON s.stop_id = b.stop_id
      WHERE r.mode = 'bus'
        AND (s.stop_name_en ILIKE '%barsha%' OR s.stop_name_en ILIKE '%ibn battuta%')
      GROUP BY r.route_number, r.route_name_en
      HAVING COUNT(DISTINCT CASE WHEN s.stop_name_en ILIKE '%barsha%' THEN 1
                                 WHEN s.stop_name_en ILIKE '%ibn battuta%' THEN 2 END) = 2;
    expected_assertions:
      - "Gives a clear yes/no on direct connection based on the bridge table"
      - "If no direct route exists, says so explicitly rather than hedging"
      - "If none exists, offers the nearest metro-based alternative"
  required_sources:
    - dataset: "rta_bus_routes-open"
    - dataset: "rta_public_transportation_routes_stops-open"
  must_trigger_agents: [A3, A4, A8]
  must_not:
    - "Fabricate a route number to satisfy the question"

