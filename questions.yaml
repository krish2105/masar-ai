- id: EN-FC-011
  lang: en
  intent: FARE_COST
  difficulty: easy
  question: "What does a Salik gate crossing cost?"
  eval_method: sql_reference
  ground_truth:
    reference_sql: |
      SELECT gate_name_en, tariff_aed, effective_from
      FROM dim_salik_tariff
      WHERE effective_to IS NULL OR effective_to >= CURRENT_DATE
      ORDER BY gate_name_en;
    expected_assertions:
      - "Quotes the tariff from dim_salik_tariff, not from model memory"
      - "States the effective_from date of the tariff used"
      - "Notes if tariffs vary by gate or time period in the loaded data"
  required_sources:
    - dataset: "rta_salik_tariff-open"
  must_trigger_agents: [A3, A8, A11]
  must_not:
    - "Quote a tariff figure not present in dim_salik_tariff"

- id: EN-FC-012
  lang: en
  intent: FARE_COST
  difficulty: medium
  question: "What is the monthly cost of a 2-zone metro commute for 22 working days?"
  eval_method: numeric_exact
  ground_truth:
    computation: "A11: fare_2zone(card_type) * 2 trips * 22 days"
    expected_assertions:
      - "Returns an exact AED figure computed by A11, not estimated by the LLM"
      - "States the card type assumed (default: Silver) as a declared assumption"
      - "Shows the working: unit fare x 2 x 22"
      - "Lists all assumptions as structured output"
  required_sources:
    - document: "corpus/en/nol-fare-zones.md"
  must_trigger_agents: [A3, A4, A6, A11]
  numeric_tolerance: 0.00
  must_not:
    - "Produce a fare figure that A11 did not compute"
    - "Omit the working-days and card-type assumptions"

