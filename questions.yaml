# ==============================================================================
# MASAR AI — GOLDEN EVALUATION SET
# tests/golden/questions.yaml
# ==============================================================================
# 60 scored questions (30 EN / 30 AR) + 12 adversarial questions (unscored gate)
#
# DESIGN PRINCIPLE — READ THIS BEFORE EDITING:
# This golden set does NOT hardcode factual answers. Hardcoding "the Red Line
# has N stations" or "a 2-zone Silver fare is AED X" would bake in facts that
# (a) I cannot verify before the data is loaded and (b) go stale the moment RTA
# republishes a dataset. A golden set full of stale hardcoded values silently
# fails correct answers and is worse than no golden set at all.
#
# Instead, ground truth is expressed three ways:
#   1. reference_sql   — the authoritative query, executed against the gold
#                        layer AT EVAL TIME. The system's answer is compared to
#                        this live result. The golden set is self-validating and
#                        never goes stale.
#   2. expected_assertions — semantic claims the answer must satisfy, graded by
#                        an LLM judge (Groq) against the retrieved context.
#   3. must_not        — hallucination traps. Violating any is an automatic FAIL
#                        regardless of other scores.
#
# A1 (Guardrail), A2 (Language), A13 (Synthesis) and A14 (Observability) execute
# on EVERY turn and are therefore omitted from must_trigger_agents. Only
# discriminating agents are listed.
# ==============================================================================

meta:
  version: "1.0.0"
  project: "Masar AI"
  created: "2026-07-24"
  total_scored: 60
  total_adversarial: 12
  language_split: { en: 30, ar: 30 }
  intent_distribution:
    JOURNEY_PLANNING: 10
    FARE_COST: 10
    SERVICE_INFO: 10
    NETWORK_ANALYTICS: 12
    GEOSPATIAL: 8
    MULTI_HOP: 10

# ------------------------------------------------------------------------------
# GOLD SCHEMA REFERENCE — all reference_sql below assumes exactly this schema.
# If Phase 3 changes a column name, update it here and in every reference_sql.
# ------------------------------------------------------------------------------
schema_reference: |
  dim_route(route_id PK, route_number, route_name_en, route_name_ar, mode,
            origin_en, origin_ar, destination_en, destination_ar,
            service_type, operator, is_active, source_dataset, last_updated)

  dim_stop(stop_id PK, stop_name_en, stop_name_ar, latitude, longitude,
           mode, zone_id, source_dataset, last_updated)

  dim_station(station_id PK, station_name_en, station_name_ar,
              line_name_en, line_name_ar, mode, zone_id,
              latitude, longitude, source_dataset, last_updated)

  dim_date(date_key PK, full_date, year, month, month_name_en, month_name_ar, quarter)

  bridge_route_stop(route_id FK, stop_id FK, stop_sequence, direction)

  fact_ridership_monthly(date_key FK, mode, route_id FK, station_id FK,
                         passenger_trips, source_dataset)

  fact_modal_split_monthly(date_key FK, mode, trips, share_pct, source_dataset)

  dim_salik_tariff(gate_id PK, gate_name_en, gate_name_ar, tariff_aed,
                   effective_from, effective_to, source_dataset)

  dim_taxi_stand(stand_id PK, stand_name_en, stand_name_ar,
                 latitude, longitude, area_en, area_ar, source_dataset)

  dim_taxi_driver_profile(period_key, nationality_group, count_drivers,
                          fleet_operator, source_dataset)

# ------------------------------------------------------------------------------
# SCORING CONFIGURATION
# ------------------------------------------------------------------------------
scoring:
  metrics:
    faithfulness:            { threshold: 0.80, weight: 0.30, judge: ragas }
    answer_relevancy:        { threshold: 0.75, weight: 0.20, judge: ragas }
    context_precision:       { threshold: 0.70, weight: 0.15, judge: ragas }
    intent_routing_accuracy: { threshold: 0.90, weight: 0.10, judge: exact_match }
    citation_validity:       { threshold: 1.00, weight: 0.15, judge: deterministic }
    numeric_accuracy:        { threshold: 1.00, weight: 0.10, judge: deterministic }

  hard_fail_conditions:
    - "any must_not violation"
    - "any [Sn] citation marker that does not resolve to a real source object"
    - "any numeric value in the answer that differs from A11 output"
    - "response language does not match question language"
    - "answer asserts real-time/live status for any entity"

  arabic_parity:
    max_faithfulness_gap: 0.10
    note: "mean(faithfulness | lang=ar) must be within 0.10 of mean(faithfulness | lang=en)"

  latency:
    p50_ms: 3500
    p95_ms: 8000

  numeric_tolerance:
    fare_aed: 0.00          # exact — A11 is deterministic
    distance_km: 0.05
    percentage: 0.5
    ridership_counts: 0     # exact — comes from SQL

# ==============================================================================
# SCORED SET — 60 QUESTIONS
# ==============================================================================
questions:

# ------------------------------------------------------------------------------
# JOURNEY_PLANNING — 10 (5 EN / 5 AR)
# ------------------------------------------------------------------------------

- id: EN-JP-001
  lang: en
  intent: JOURNEY_PLANNING
  difficulty: easy
  question: "Which bus routes serve Union metro station?"
  eval_method: sql_reference
  ground_truth:
    reference_sql: |
      SELECT DISTINCT r.route_number, r.route_name_en
      FROM dim_route r
      JOIN bridge_route_stop b ON b.route_id = r.route_id
      JOIN dim_stop s ON s.stop_id = b.stop_id
      WHERE r.mode = 'bus'
        AND s.stop_name_en ILIKE '%union%'
        AND r.is_active = true
      ORDER BY r.route_number;
    expected_assertions:
      - "Lists specific bus route numbers, not a generic description"
      - "States the source dataset and its last_updated date"
  required_sources:
    - dataset: "rta_bus_routes-open"
    - dataset: "rta_public_transportation_routes_stops-open"
  must_trigger_agents: [A3, A4, A8]
  must_not:
    - "State current bus positions or live arrival times"
    - "Invent route numbers not present in the result set"

- id: EN-JP-002
  lang: en
  intent: JOURNEY_PLANNING
  difficulty: medium
  question: "How do I get from Deira City Centre to Mall of the Emirates by metro?"
  eval_method: assertion
  ground_truth:
    reference_sql: |
      SELECT station_name_en, line_name_en, zone_id
      FROM dim_station
      WHERE mode = 'metro'
        AND (station_name_en ILIKE '%city centre%'
             OR station_name_en ILIKE '%mall of the emirates%');
    expected_assertions:
      - "Identifies both stations and the metro line(s) each sits on"
      - "Correctly identifies whether an interchange is required"
      - "If an interchange is needed, names the interchange station"
      - "Reports interchange count rather than a journey duration"
  required_sources:
    - dataset: "rta_metro_lines-open"
    - dataset: "rta_public_transportation_routes_stops-open"
  must_trigger_agents: [A3, A4, A8, A10]
  must_not:
    - "State a specific journey time in minutes"
    - "Claim live service status"

